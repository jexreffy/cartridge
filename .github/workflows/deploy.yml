name: Deploy Cartridge

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set RAWG API key in SSM
        run: |
          aws ssm put-parameter \
            --name "/cartridge/rawg-api-key" \
            --value "${{ secrets.RAWG_API_KEY }}" \
            --type "SecureString" \
            --overwrite \
            --region us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint & test Python
        working-directory: api
        run: |
          pip install black ruff pytest
          pip install -r requirements-dev.txt
          black --check .
          ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy CDK stacks
        working-directory: cdk
        run: |
          npm ci
          npm run build
          npx cdk deploy CartridgeNetworking CartridgeAuth CartridgeStorage CartridgeImport CartridgeApi CartridgeScheduler --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Get Cognito IDs from CloudFormation outputs
        id: cognito
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name CartridgeAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name CartridgeAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Build & lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}

